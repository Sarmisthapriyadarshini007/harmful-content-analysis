<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SafeTube AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="auth.css">
</head>

<body>
    <!-- Animated background shapes -->
    <div class="bg-shape bg-shape-1"></div>
    <div class="bg-shape bg-shape-2"></div>

    <div class="auth-container">
        <!-- Illustration Side -->
        <div class="auth-illustration">
            <a href="index.html" class="brand-logo">
                <span class="brand-icon"></span>
                SafeTube<span style="color: var(--primary);">AI</span>
            </a>
            <img src="assets/youtube_ai_analytics_illustration.png"
                alt="AI Security Illustration" class="illustration-image">
            <div class="illustration-text">
                <h2>Secure Your Community</h2>
                <p>Advanced AI models working 24/7 to analyze and filter harmful content.</p>
            </div>
        </div>

        <!-- Form Side -->
        <div class="auth-form-wrap">
            <!-- Mobile Logo -->
            <a href="index.html" class="brand-logo" style="display: none;">
                <span class="brand-icon"></span>
                SafeTube<span style="color: var(--primary);">AI</span>
            </a>

            <a href="index.html" class="back-link">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                Back to Home
            </a>

            <div class="auth-header">
                <h1>Welcome Back</h1>
                <p>Enter your credentials to access your dashboard.</p>
            </div>

            <form action="#" method="POST">
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" class="form-input" autocomplete="off" required>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" class="form-input" autocomplete="current-password" required>
                        <button type="button" class="password-toggle" id="togglePassword">
                            <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-wrap">
                        <input type="checkbox" name="remember" checked>
                        <span>Remember Me</span>
                    </label>
                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-primary">Log In</button>

                <div class="divider">or continue with</div>

                <button type="button" class="btn btn-google">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                            fill="#4285F4" />
                        <path
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                            fill="#34A853" />
                        <path
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                            fill="#FBBC05" />
                        <path
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                            fill="#EA4335" />
                    </svg>
                    Log In with Google
                </button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="register.html">Create Account</a>
            </div>
        </div>
    </div>

    <script>
        // Remember Me functionality
        const emailInput = document.getElementById('email');
        const rememberCheck = document.querySelector('input[name="remember"]');

        // Load saved email if exists
        const savedEmail = localStorage.getItem('safetube_remembered_email');
        if (savedEmail) {
            emailInput.value = savedEmail;
            rememberCheck.checked = true;
        } else {
            rememberCheck.checked = false;
        }

        // Form redirection & saving state
        document.querySelector('form').addEventListener('submit', function (e) {
            e.preventDefault(); // Prevent default form submission

            // Save or remove email based on checkbox
            if (rememberCheck.checked) {
                localStorage.setItem('safetube_remembered_email', emailInput.value);
            } else {
                localStorage.removeItem('safetube_remembered_email');
            }

            // Always save email for profile usage
            localStorage.setItem('safetube_user_email', emailInput.value);

            window.location.href = 'dashboard.html';
        });

        document.querySelector('.btn-google').addEventListener('click', function () {
            window.location.href = 'dashboard.html';
        });

        // Show logo on mobile
        if (window.innerWidth <= 768) {
            document.querySelectorAll('.brand-logo')[1].style.display = 'flex';
        }
        window.addEventListener('resize', () => {
            if (window.innerWidth <= 768) {
                document.querySelectorAll('.brand-logo')[1].style.display = 'flex';
            } else {
                document.querySelectorAll('.brand-logo')[1].style.display = 'none';
            }
        });

        // Password Toggle
        const togglePassword = document.getElementById('togglePassword');
        const password = document.getElementById('password');
        togglePassword.addEventListener('click', function () {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            if(type === 'text') {
                this.innerHTML = '<svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
            } else {
                this.innerHTML = '<svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
            }
        });
    </script>
</body>
</html>
