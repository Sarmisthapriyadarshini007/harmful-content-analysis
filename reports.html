<head>
    <meta charset="UTF-8">

    <style>
        /* Specific Styles for Reports Page */
        .controls-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-card);
            padding: 1rem 1.5rem;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            margin-bottom: 2rem;
            box-shadow: var(--shadow-sm);
        }

        .filter-group {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-select {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background: var(--bg-main);
            color: var(--text-dark);
            font-size: 0.875rem;
            outline: none;
            cursor: pointer;
        }

        .search-input {
            padding: 0.5rem 1rem 0.5rem 2.5rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background: var(--bg-main) url('data:image/svg+xml;utf8,<svg width="16" height="16" fill="none" stroke="%2364748B" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>') no-repeat 10px center;
            outline: none;
            width: 250px;
            font-size: 0.875rem;
        }

        /* Report Cards Grid */
        .reports-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .report-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
        }

        .report-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .report-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1.25rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .report-title-area {
            flex: 1;
            padding-right: 1rem;
        }

        .report-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 0.25rem;
            line-height: 1.4;
        }

        .report-date {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .badge-status {
            padding: 4px 10px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
        }
        
        .status-completed { background: #D1FAE5; color: #065F46; }
        .status-processing { background: #DBEAFE; color: #1E40AF; }

        .report-metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .metric-box {
            background: var(--bg-main);
            padding: 1rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }

        .metric-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }

        .metric-value {
            font-size: 1.25rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .risk-high { color: var(--danger); }
        .risk-medium { color: var(--warning); }
        .risk-low { color: var(--success); }

        .report-actions {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
            margin-top: auto;
        }

        .btn-action {
            padding: 0.5rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background: var(--bg-main);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: var(--text-main);
        }

        .btn-action:hover { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }
        
        .btn-view:hover { color: var(--primary); border-color: var(--primary); background: var(--primary-light); }
        .btn-pdf:hover { color: #DC2626; border-color: #FECACA; background: #FEF2F2; }
        .btn-csv:hover { color: #059669; border-color: #A7F3D0; background: #ECFDF5; }
        .btn-delete:hover { color: var(--danger); border-color: #FECACA; background: #FEE2E2; }

        @media (max-width: 768px) {
            .reports-grid { grid-template-columns: 1fr; }
            .controls-bar { flex-direction: column; align-items: stretch; }
            .search-input { width: 100%; }
            .filter-group { justify-content: space-between; }
        }
    </style>
</head>

        <!-- Dashboard Body -->
        <div class="dashboard-body">
            <div class="page-header animate-fade-up">
                <h1>Generated Reports</h1>
                <p>View, download, and manage your AI moderation reports.</p>
            <!-- Controls (Search & Filters) -->
            <div class="controls-bar animate-fade-up delay-1">
                <div class="filter-group">
                    <input type="text" class="search-input" id="reportSearch" placeholder="Search by video name...">
                    <select class="filter-select" id="riskFilter">
                        <option value="all">Risk Level: All</option>
                        <option value="high">High Risk</option>

        if (mobileMenuBtn && sidebar) {
            mobileMenuBtn.addEventListener('click', () => {
